<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subjects | PASIYA-MD   AI </title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <h1>📘 Subjects for <span id="gradeTitle"></span></h1>
  </header>

  <section class="subject-list" id="subjectList"></section>

  <footer class="footer">
    <p>POWERED BY PASIYA-MD TEAM</p>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const grade = urlParams.get('grade');
    document.getElementById('gradeTitle').innerText = "Grade " + grade;

    const subjects = {
      1:["Mathematics","English","Sinhala","Environmental Studies"],
      2:["Mathematics","English","Sinhala","Science"],
      6:["Mathematics","Science","History","English","ICT"],
      10:["Mathematics","Science","ICT","History","Geography","English"],
      12:["Physics","Chemistry","Biology","Combined Maths","ICT","Business Studies"],
      13:["Physics","Chemistry","ICT","Accounting","Economics"]
    };

    const subjectList = document.getElementById("subjectList");
    const list = subjects[grade] || ["Maths","Science","English","History","ICT"];
    list.forEach(sub=>{
      subjectList.innerHTML += `<a class='subject-box' href="syllabus.html?grade=${grade}&subject=${sub}">${sub}</a>`;
    });
  </script>
</body>
</html>
