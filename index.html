<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASIYA-MD AI SCHOOL Chat</title>
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #0a0a0a;
  color: #f0b90b;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
header { font-size: 28px; margin-bottom: 20px; text-shadow: 0 0 10px #f0b90b; }
#chatOutput {
  width: 100%; max-width: 600px; min-height: 400px;
  border: 2px solid #f0b90b; border-radius: 12px;
  padding: 15px; overflow-y: auto; background: #111;
  margin-bottom: 15px;
}
.user { text-align: right; margin: 10px 0; color: #00ffcc; }
.ai { text-align: left; margin: 10px 0; color: #f0b90b; }
#userInput { width: 80%; max-width: 500px; padding: 12px; border-radius: 8px; border: 2px solid #f0b90b; background: #000; color: #fff; }
button { padding: 10px 20px; margin-left: 10px; border:none; border-radius: 8px; background:#f0b90b; color:#000; font-weight:600; cursor:pointer; transition:0.3s; }
button:hover { background:#000; color:#f0b90b; box-shadow:0 0 10px #f0b90b; }
</style>
</head>
<body>

<header>PASIYA-MD AI SCHOOL Chat 🤖</header>

<div id="chatOutput"></div>

<div>
  <input type="text" id="userInput" placeholder="Type your question here...">
  <button onclick="sendQuestion()">Ask AI</button>
</div>

<script>
const GEMINI_KEY = "AIzaSyDwSwyxmlsieKfXMMOPFsur1VSbCIz233M";

async function askGemini(question) {
  const response = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=" + GEMINI_KEY,
    {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        contents: [{ parts: [{ text: question }]}]
      })
    }
  );
  const data = await response.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || "No answer found.";
}

async function sendQuestion() {
  const input = document.getElementById('userInput');
  const question = input.value.trim();
  if(!question) return;
  appendMsg("user", question);
  input.value = "";
  appendMsg("ai", "Thinking...");
  const answer = await askGemini(question);
  document.querySelector(".ai:last-child").innerText = answer;
}

function appendMsg(role, msg) {
  const box = document.getElementById("chatOutput");
  const div = document.createElement("div");
  div.className = role;
  div.textContent = (role==="user"?"🧑‍🎓 ":"🤖 ")+msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
