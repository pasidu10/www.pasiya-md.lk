<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASIYA-MD AI SCHOOL ai</title>
<style>
body { font-family: 'Poppins', sans-serif; background:#0a0a0a; color:#f0b90b; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; }
header { font-size:28px; margin-bottom:20px; text-shadow:0 0 10px #f0b90b; }
#chatOutput { width:100%; max-width:600px; min-height:400px; border:2px solid #f0b90b; border-radius:12px; padding:15px; overflow-y:auto; background:#111; margin-bottom:15px; }
.user { text-align:right; margin:10px 0; color:#00ffcc; }
.ai { text-align:left; margin:10px 0; color:#f0b90b; }
#userInput { width:80%; max-width:500px; padding:12px; border-radius:8px; border:2px solid #f0b90b; background:#000; color:#fff; }
button { padding:10px 20px; margin-left:10px; border:none; border-radius:8px; background:#f0b90b; color:#000; font-weight:600; cursor:pointer; transition:0.3s; }
button:hover { background:#000; color:#f0b90b; box-shadow:0 0 10px #f0b90b; }
</style>
</head>
<body>

<header>PASIYA-MD AI SCHOOL Chat GPT 🤖</header>

<div id="chatOutput"></div>

<div>
  <input type="text" id="userInput" placeholder="Type your question here...">
  <button onclick="sendQuestion()">Ask AI</button>
</div>

<script src="app.js"></script>

</body>
</html>
