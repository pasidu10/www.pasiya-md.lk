<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PASIYA-MD AI</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <h1>🤖 AI Study Assistant</h1>
    <p>Ask anything related to your studies!</p>
  </header>

  <section class="chat-box">
    <div id="chatOutput"></div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your question here...">
      <button onclick="sendQuestion()">Ask</button>
    </div>
  </section>

  <footer class="footer">
    <p>POWERED BY PASIYA-MD TEAM</p>
  </footer>

  <script>
    async function sendQuestion(){
      const input = document.getElementById('userInput').value;
      if(!input) return;
      document.getElementById('chatOutput').innerHTML += `<div class='user'>🧑‍🎓 ${input}</div>`;
      document.getElementById('userInput').value='';
      document.getElementById('chatOutput').innerHTML += `<div class='ai'>🤖 Thinking...</div>`;
      // Demo AI answer
      setTimeout(()=>{
        document.querySelector('.ai:last-child').innerHTML = "This is AI's response for your question!";
      },1000);
    }
  </script>
</body>
</html>
